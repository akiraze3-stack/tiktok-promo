        }

        .btn-wa {
            display: flex;
            align-items: center;
            justify-content: center; /* Центрируем иконку и текст внутри */
            background-color: white; /* Чистый белый фон */
            color: #000;
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 50px; /* Сильно округлые углы */
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
            max-width: 300px; /* Чтобы кнопка не была слишком широкой */
            margin: 0 auto;
        }

        .btn-wa:active {
            transform: scale(0.96);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .wa-icon-svg {
            width: 24px;
            height: 24px;
            margin-right: 12px; /* Расстояние до текста */
            fill: #25D366; /* Зеленый цвет WhatsApp */
        }

        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            font-size: 13px;
            opacity: 0.6;
        }
